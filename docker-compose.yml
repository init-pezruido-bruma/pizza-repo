services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza
      POSTGRES_DB: pizza
    ports:
      - "5433:5432"
    volumes:
      - pizza_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pizza_pg:
